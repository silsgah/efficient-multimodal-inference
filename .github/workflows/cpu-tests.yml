name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install CPU test dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run adaptive CPU smoke test
        run: python scripts/validate_adaptive_cpu.py
